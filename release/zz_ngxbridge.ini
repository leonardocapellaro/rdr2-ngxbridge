; zz_ngxbridge.ini - configuracao de producao (RDR2 + OptiScaler 0.9.4 + RDR2VulkanFG beta)
; Coloque este arquivo NA MESMA PASTA do zz_ngxbridge.asi (diretorio do RDR2.exe).

[bridge]
; 0 desliga a ponte por completo (o jogo volta ao comportamento anterior).
Enabled=1

; Spoof: responde GetModuleFileNameW/A apenas para perguntas vindas do modulo
; de captura (CallerHints) sobre o handle do OptiScaler. E o que faz o gate do
; RDR2VulkanFG aceitar a implementacao de upscale do OptiScaler como provedora
; "nvngx.dll". Sem isso o wrapper de inputs nunca e instalado.
Spoof=1

; Mirror: espelha a vtable do objeto de parametros NGX (16 slots tipados) para
; que as leituras cross-type do mapa reverso do RDR2VulkanFG (ex.: flags por
; slot "unsigned" quando o jogo gravou "int") recebam resposta valida. So faz
; conversoes seguras (ponteiro<->inteiro de 64 bits, inteiro com sinal<->sem
; sinal, inteiro a partir de ULL com checagem de faixa). Nunca inventa valores.
Mirror=1

; Nome do modulo que serve as exportacoes NVSDK_NGX_VULKAN_* (o OptiScaler).
; So mude se voce usar outro nome de arquivo para o OptiScaler.
Target=OptiScaler.asi

; Subcadeias (case-insensitive) do caminho do modulo que precisa do spoof -
; e o ASI do RDR2VulkanFG (nome do binario de producao: RDR2VulkanFG.asi).
; O dinput8 ASI loader carrega todo .asi da pasta; se voce renomear o ASI do
; RDR2VulkanFG, ajuste aqui.
CallerHints=rdr2vulkanfg
